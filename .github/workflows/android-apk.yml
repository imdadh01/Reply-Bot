name: Build Android APK (manual, no tests)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/android-apk.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.before == '7e57bce9a7464b8db05d3402b3f72f1ce22fa02a'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble personal-use debug APK (no tests)
        working-directory: android
        run: gradle --no-daemon assembleDebug -x test -x lint
      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk reply-bot-fixed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: reply-bot-fixed-android
          path: reply-bot-fixed.apk
          if-no-files-found: error
