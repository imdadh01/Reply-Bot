name: Build Android APK (no tests)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.before == 'fcbdeb43b3f73dedef0e73997d875f1eb1ab4489'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble personal-use debug APK (no tests)
        working-directory: android
        run: gradle --no-daemon assembleDebug -x test -x lint
      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk reply-bot.apk
      - uses: actions/upload-artifact@v4
        with:
          name: reply-bot-android-debug
          path: reply-bot.apk
          if-no-files-found: error
